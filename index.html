<title>Электросмета</title>
<style>
:root{--bg:#F2F1EC;--sf:#FFFFFF;--sf2:#EBE9E2;--ln:rgba(20,21,23,.08);--ln2:rgba(20,21,23,.15);--tx:#141517;--mu:#6F6E69;--ac:#FFCD1F;--acd:#8A6A00;--ink:#141517;--tint:rgba(255,205,31,.17);--grid:rgba(20,21,23,.05);--ok:#16A065;--bad:#D33A3F;--hd:rgba(242,241,236,.85);--dock:#141517;--dtx:#F2F1EC;--sh:0 1px 2px rgba(20,21,23,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F11;--sf:#17181B;--sf2:#22242A;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.13);--tx:#F1F0EB;--mu:#8D9099;--ac:#FFD23F;--acd:#FFD23F;--ink:#121315;--tint:rgba(255,210,63,.09);--grid:rgba(255,255,255,.028);--ok:#3DDC97;--bad:#FF6B6B;--hd:rgba(14,15,17,.84);--dock:#1E2025;--dtx:#F1F0EB;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0F11;--sf:#17181B;--sf2:#22242A;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.13);--tx:#F1F0EB;--mu:#8D9099;--ac:#FFD23F;--acd:#FFD23F;--ink:#121315;--tint:rgba(255,210,63,.09);--grid:rgba(255,255,255,.028);--ok:#3DDC97;--bad:#FF6B6B;--hd:rgba(14,15,17,.84);--dock:#1E2025;--dtx:#F1F0EB;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body{margin:0 auto;max-width:600px;min-height:100vh;color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.plain{border:0;background:none;padding:0;text-align:left}

/* шапка */
#hd{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;background:var(--hd);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ac);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(255,205,31,.35)}
.logo svg{width:20px;height:20px;fill:var(--ink)}
.obj{flex:1;min-width:0}
.obj small{display:block;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu)}
.obj b{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:750;letter-spacing:-.3px}
.obj b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj svg{width:18px;height:18px;flex:none;color:var(--mu)}
.tabs{display:flex;gap:24px;margin:10px 0 -1px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;border:0;background:none;padding:8px 0 12px;font-weight:650;font-size:15px;color:var(--mu);position:relative}
.tabs button.on{color:var(--tx)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ac)}
@media (max-width:440px){.tabs{justify-content:space-between;gap:12px}}

/* списки */
main{padding:2px 16px calc(env(safe-area-inset-bottom,0px) + 130px)}
.sec{display:flex;align-items:center;gap:10px;margin:24px 2px 9px}
.ix{font:700 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acd);background:var(--tint);padding:4px 6px;border-radius:6px}
.sec h2{margin:0;flex:1;font-size:12.5px;font-weight:750;letter-spacing:1px;text-transform:uppercase}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--ac);color:var(--ink);font-size:12px;font-weight:700;line-height:22px;text-align:center}
.badge:empty{display:none}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 15px;border-top:1px solid var(--ln);position:relative;transition:background .2s}
.box>.row:first-child{border-top:0}
.row.sel{background:var(--tint)}
.row.sel::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ac)}
.rt{flex:1;min-width:0;display:block}
.rt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.pr{display:inline-block;border:0;background:none;padding:3px 0 0;margin:0;font:500 12.5px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mu);text-align:left}
button.pr{text-decoration:underline dotted;text-underline-offset:3px}
.pr.no{color:var(--bad)}
.stp{display:flex;align-items:center;flex:none;background:var(--sf2);border-radius:12px;padding:2px}
.stp button{width:34px;height:36px;border:0;background:none;font-size:20px;line-height:1;border-radius:10px;color:var(--tx)}
.stp button:active{background:var(--ln2)}
.stp input{width:60px;height:36px;border:0;border-radius:9px;background:var(--sf);text-align:center;font:600 16px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--tx);padding:0;-webkit-appearance:none;appearance:none}
.stp input:focus{outline:2px solid var(--ac);outline-offset:0}
.stp input::placeholder{color:var(--mu);opacity:.55}
.add{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px dashed var(--ln2);background:none;padding:12px 15px;color:var(--acd);font-weight:650;font-size:14px;text-align:left}
.note{display:block;width:100%;text-align:left;border:1px solid rgba(255,205,31,.5);border-radius:14px;padding:12px 14px;margin:16px 0 0;font-size:14px;font-weight:600;background:var(--tint);color:var(--tx)}
.note.bad{background:rgba(211,58,63,.1);border-color:rgba(211,58,63,.3);color:var(--bad)}
.hint{font-size:13px;color:var(--mu);margin:10px 2px 0}
.meta{display:block;width:100%;text-align:left;margin-top:16px;padding:12px 14px;border-radius:14px;border:1px dashed var(--ln2);background:none;font-size:14px;color:var(--mu);white-space:pre-wrap}
.meta b{color:var(--tx);font-weight:600}
.empty{text-align:center;padding:48px 24px;color:var(--mu);font-size:14px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}

/* нижняя панель */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#bar:empty{display:none}
.dock{max-width:576px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--dock);color:var(--dtx);border-radius:20px;padding:8px 8px 8px 18px;pointer-events:auto;box-shadow:0 14px 40px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06)}
.dk{flex:1;min-width:0}
.dk small{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;font-weight:700}
.dk b{font-size:20px;font-weight:700}
.go{display:flex;align-items:center;gap:8px;border:0;background:var(--ac);color:var(--ink);font-weight:800;font-size:15px;padding:14px 18px;border-radius:14px;transition:transform .1s}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.4}
.go svg{width:17px;height:17px;fill:currentColor}
.dock.sum{padding:12px 18px}
.dkc{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1)}
.dkc.on{background:var(--ac);color:var(--ink)}
.tg{width:50px;height:30px;flex:none;border:0;border-radius:99px;background:var(--ln2);position:relative;transition:background .2s;padding:0}
.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tg.on{background:var(--ac)}
.tg.on i{transform:translateX(20px)}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--ln2);background:var(--sf);color:var(--tx);font-weight:700;font-size:15px;margin:10px 0 0}
.btn.y{background:var(--ac);border-color:transparent;color:var(--ink)}
.btn.r{color:var(--bad)}
.btn:active{transform:scale(.99)}
.two{display:flex;gap:10px}
.two .btn{margin-top:14px}
.seg{display:flex;gap:3px;background:var(--sf2);border-radius:12px;padding:3px;margin-top:16px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:650;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ib{width:34px;height:34px;flex:none;border:0;border-radius:10px;background:var(--sf2);color:var(--mu);font-size:15px}
.amt{font-size:13.5px;font-weight:600;white-space:nowrap}

/* закупка */
.chk{width:100%;border:0;border-top:1px solid var(--ln);background:none;text-align:left;font:inherit;color:inherit}
.cb{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--ln2);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
.chk.done .cb{background:var(--ok);border-color:var(--ok)}
.chk.done .rt b{text-decoration:line-through;color:var(--mu);font-weight:500}
.qt{flex:none;font-weight:700;font-size:15px}
.chk.done .qt{color:var(--mu)}
.prog{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--sf);border:1px solid var(--ln)}
.prog b{font-size:20px;display:block}
.prog small{color:var(--mu);font-size:12px}
.pb{flex:1;height:8px;border-radius:9px;background:var(--sf2);overflow:hidden}
.pb i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}

/* настройки */
.big{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:28px 2px 0}
.sub-h{font-size:12px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin:18px 2px 8px}
.pf{display:flex;align-items:center;gap:5px;flex:none;background:var(--sf2);border-radius:11px;padding:0 10px 0 4px}
.pf input{width:76px;border:0;background:none;text-align:right;font:600 16px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--tx);padding:9px 0;-webkit-appearance:none;appearance:none}
.pf input:focus{outline:none}
.pf:focus-within{box-shadow:0 0 0 2px var(--ac)}
.pf input::placeholder{color:var(--mu);opacity:.55}
.pf span{font-size:12px;color:var(--mu);white-space:nowrap;min-width:38px}
.ed{font-size:12px;color:var(--mu);font-weight:400}

/* нижние листы */
#sh{position:fixed;inset:0;z-index:10;display:none}
#sh.open{display:block}
#sh .ov{position:absolute;inset:0;background:rgba(8,9,10,.5);animation:fd .2s}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--mu);opacity:.3;margin:0 auto 10px}
.sht{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.sht h3{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--sf2);color:var(--mu);font-size:15px;flex:none}
.pname{font-weight:600;margin-top:8px}
.lb{display:block;font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mu);margin:16px 2px 7px}
.in{width:100%;border-radius:12px;border:1px solid var(--ln2);background:var(--sf);color:var(--tx);padding:12px 13px;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-appearance:none;appearance:none}
.in:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--tint)}
.in.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
textarea.in{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips button{border:1px solid var(--ln2);background:var(--sf);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* смета-чек */
.rc{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px 16px 16px;margin-top:10px;box-shadow:var(--sh)}
.rch{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;border-bottom:2px solid var(--tx)}
.rch div{flex:1;min-width:0}
.rch small{display:block;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mu);font-weight:700}
.rch b{display:block;font-size:18px;font-weight:800;margin-top:3px}
.rch div span{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.rch>.mono{font-size:12px;color:var(--mu);white-space:nowrap;margin-top:2px}
.rc h4{margin:16px 0 2px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--acd);font-weight:800}
.ln{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--ln2)}
.rc h4+.ln{border-top:0}
.ln .t{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.ln .t small{display:block;font-size:12.5px;color:var(--mu);margin-top:2px}
.ln .s{font-weight:700;font-size:14.5px;white-space:nowrap}
.tl{margin-top:12px;padding-top:4px;border-top:2px solid var(--tx)}
.sm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 0;font-size:14.5px}
.dv{display:flex;align-items:center;gap:10px}
.dv .mono{color:var(--mu);font-size:13.5px}
.dv .pf input{width:44px}
.dv .pf span{min-width:0}
.grand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;background:var(--ac);color:var(--ink);border-radius:14px;padding:14px 16px}
.grand span{font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:13px}
.grand b{font-size:26px;font-weight:800}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,16px);opacity:0;background:var(--dock);color:var(--dtx);padding:10px 18px;border-radius:12px;font-weight:650;font-size:14px;z-index:20;transition:transform .25s,opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0);opacity:1}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
</style></head><body>

<main id="app"></main>

<script>

const inV=n=>n>0?String(n).replace('.',','):'';
const num=s=>{const v=parseFloat(String(s||'').replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---------- данные ----------
// работы, материалы и расходники общие для всех объектов; у объекта свои количества (q, m, c),
// отметки «куплено» (b), разовые позиции (xw, xm) и флаг «расходники в смете» (ci)
function mk(src,pf,price){let i=0;const a=[];src.forEach(([g,it])=>it.forEach(([n,u,id])=>{const x={id:id||pf+(++i),g,n,u};if(price)x.p=0;a.push(x)}));return a}
function newObj(n){return{id:uid('o'),n:n||'Новый объект',cl:'',nt:'',d:today(),q:{},xw:[],m:{},xm:[],b:{},c:{},ci:true,disc:0}}
function init(){const o=newObj('Первый объект');return{v:2,works:mk(W0,'w',1),mats:mk(M0,'m',0),cons:[],objs:[o],cur:o.id,theme:'auto'}}
function fixObj(o){o.q=o.q||{};o.xw=o.xw||[];o.m=o.m||{};o.xm=o.xm||[];o.b=o.b||{};o.c=o.c||{};if(o.ci===undefined)o.ci=true;
o.disc=o.disc||0;o.cl=o.cl||'';o.nt=o.nt||'';o.d=o.d||today();return o}
function migrate(o){o.works=o.works||[];o.mats=o.mats||[];o.cons=o.cons||[];
if((o.v||1)<2)mk(W0,'w',1).filter(x=>V2.includes(x.id)&&!o.works.some(y=>y.id==x.id)).forEach(x=>insertG(o.works,x));
o.objs=(o.objs||[]).map(fixObj);if(!o.objs.length)o.objs.push(newObj());
if(!o.objs.some(x=>x.id==o.cur))o.cur=o.objs[0].id;o.theme=o.theme||'auto';o.v=2;return o}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}S=S&&S.v?migrate(S):init()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Не удалось сохранить')}}

const cur=()=>S.objs.find(o=>o.id==S.cur);
function groups(a){const m=new Map();a.forEach(x=>{if(!m.has(x.g))m.set(x.g,[]);m.get(x.g).push(x)});return[...m]}
const works=o=>S.works.concat(o.xw.map(x=>({...x,g:XG,own:1})));
function mats(o){const a=S.mats.slice();o.xm.forEach(x=>{let i=-1;a.forEach((y,j)=>{if(y.g==x.g)i=j});const it={...x,own:1};if(i<0)a.push(it);else a.splice(i+1,0,it)});return a}
function insertG(L,x){let j=-1;L.forEach((y,k)=>{if(y.g==x.g)j=k});if(j<0)L.push(x);else L.splice(j+1,0,x)}
function setQ(o,k,id,v){if(v>0)o[k][id]=r2(v);else{delete o[k][id];if(k=='m')delete o.b[id]}}
function calc(o){let sum=0,miss=0;const lines=[];
const add=(x,q)=>{if(!(q>0))return;const p=x.p||0;if(!p)miss++;const s=r2(q*p);sum+=s;lines.push({...x,q,p,s})};
works(o).forEach(x=>add(x,o.q[x.id]));
if(o.ci)S.cons.forEach(x=>add({...x,g:CG},o.c[x.id]));
sum=r2(sum);const disc=Math.min(100,Math.max(0,o.disc||0)),dv=Math.round(sum*disc/100);
return{lines,sum,disc,dv,tot:r2(sum-dv),miss,cons:lines.some(l=>l.g==CG)}}
function conSum(o){let s=0,n=0;S.cons.forEach(x=>{const q=o.c[x.id];if(q>0){n++;s+=q*(x.p||0)}});return{s:r2(s),n}}
const footNote=c=>c.cons?'Цены указаны за работу и расходные материалы, основные материалы не входят.':'Цены указаны за работу, материалы не входят.';

// ---------- экраны ----------
function vHead(){const o=cur();
return `<div class="brand"><div class="logo">${BOLT}</div><button class="obj plain" data-a="objs"><small>Объект</small><b><span>${esc(o.n)}</span>${CHEV}</b></button></div>`+
`<nav class="tabs">${[['est','Смета'],['mat','Материалы'],['con','Расходники'],['set','Настройки']].map(t=>`<button class="${tab==t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav>`}

function secHead(i,g,it,k){const o=cur(),n=it.filter(x=>o[k][x.id]>0).length;
return `<div class="sec"><span class="ix">${p2(i+1)}</span><h2>${esc(g)}</h2><span class="badge mono" data-cnt="${it.map(x=>x.id).join(',')}" data-k="${k}">${n||''}</span></div>`}

function qRow(x,q,k){let sub;
if(k!='m')sub=`<button class="pr ${x.p>0?'':'no'}" data-a="${k=='c'?'econ':x.own?'exw':'price'}" data-id="${x.id}">${x.p>0?money(x.p)+' / '+esc(x.u):'нет цены · '+esc(x.u)}</button>`;
else sub=x.own?`<button class="pr" data-a="exm" data-id="${x.id}">свой вариант · ${esc(x.u)}</button>`:`<span class="pr">${esc(x.u)}</span>`;
return `<div class="row ${q>0?'sel':''}"><div class="rt"><b>${esc(x.n)}</b>${sub}</div><div class="stp">`+
`<button data-a="dec" data-k="${k}" data-id="${x.id}" aria-label="Меньше">−</button>`+
`<input inputmode="decimal" enterkeyhint="done" data-k="${k}" data-id="${x.id}" value="${inV(q)}" placeholder="0" aria-label="Количество">`+
`<button data-a="inc" data-k="${k}" data-id="${x.id}" aria-label="Больше">+</button></div></div>`}

function vEst(){const o=cur();let h='';
if(!S.works.some(x=>x.p>0))h+=`<button class="note" data-a="tab" data-t="set">⚡ Сначала проставь цены: «Настройки» → «Цены на работы». Без цен смета посчитается в ноль.</button>`;
if(o.cl||o.nt)h+=`<button class="meta" data-a="eobj" data-id="${o.id}">${o.cl?'<b>'+esc(o.cl)+'</b>'+(o.nt?'\n':''):''}${esc(o.nt)}</button>`;
groups(works(o)).forEach(([g,it],i)=>{h+=secHead(i,g,it,'q')+'<div class="box">'+it.map(x=>qRow(x,o.q[x.id],'q')).join('')+'</div>'});
return h+`<button class="btn" data-a="exw" data-id="" style="margin-top:18px">＋ Разовая работа</button><p class="hint">Разовая работа есть только в этом объекте и в прайс не попадает.</p>`}

function vMat(){const o=cur(),L=mats(o),need=L.filter(x=>o.m[x.id]>0),G=groups(L),gi=new Map(G.map((g,i)=>[g[0],i]));
let h=`<div class="seg"><button class="${mmode=='q'?'on':''}" data-a="mmode" data-v="q">Количество</button><button class="${mmode=='buy'?'on':''}" data-a="mmode" data-v="buy">К покупке<span id="needc">${need.length?' · '+need.length:''}</span></button></div>`;
if(mmode=='q'){h+=`<p class="hint">Сколько чего понадобится на этот объект. Это список для закупки, в смету он не идёт.</p>`;
G.forEach(([g,it],i)=>{h+=secHead(i,g,it,'m')+'<div class="box">'+it.map(x=>qRow(x,o.m[x.id],'m')).join('')+`<button class="add" data-a="xm" data-g="${esc(g)}">＋ Свой вариант</button></div>`});
return h}
if(!need.length)return h+`<div class="empty"><b>Список пуст</b>Укажи количество во вкладке «Количество», и здесь появится, что купить.</div>`;
const done=need.filter(x=>o.b[x.id]).length;
h+=`<div class="prog"><div><b class="mono">${done} / ${need.length}</b><small>куплено</small></div><div class="pb"><i style="width:${Math.round(done/need.length*100)}%"></i></div></div>`;
groups(need).forEach(([g,it])=>{h+=`<div class="sec"><span class="ix">${p2(gi.get(g)+1)}</span><h2>${esc(g)}</h2></div><div class="box">`+
it.map(x=>`<button class="row chk ${o.b[x.id]?'done':''}" data-a="buy" data-id="${x.id}"><span class="cb">${o.b[x.id]?'✓':''}</span><span class="rt"><b>${esc(x.n)}</b></span><span class="qt mono">${fN(o.m[x.id])} ${esc(x.u)}</span></button>`).join('')+'</div>'});
h+=`<div class="two"><button class="btn y" data-a="mshare">Отправить список</button><button class="btn" data-a="mcopy">Скопировать</button></div>`;
if(done)h+=`<button class="btn" data-a="mreset">Снять отметки «куплено»</button>`;
return h}

function vCon(){const o=cur();
if(!S.cons.length)return `<div class="empty"><b>Расходников пока нет</b>Добавь то, что уходит на объект: хомуты, клипсы, дюбели, изоленту. У каждого своя цена.</div><button class="btn y" data-a="econ" data-id="">＋ Добавить расходник</button>`;
let h=`<div class="box" style="margin-top:16px"><div class="row"><div class="rt"><b>Добавлять в смету</b><span class="pr">${o.ci?'отдельным разделом «Расходные материалы»':'не добавляются, считаются только для тебя'}</span></div>`+
`<button class="tg ${o.ci?'on':''}" data-a="ci" role="switch" aria-checked="${o.ci}" aria-label="Добавлять расходники в смету"><i></i></button></div></div>`;
h+=`<div class="sec"><h2>Расходники</h2><span class="badge mono" data-cnt="${S.cons.map(x=>x.id).join(',')}" data-k="c">${S.cons.filter(x=>o.c[x.id]>0).length||''}</span></div>`+
'<div class="box">'+S.cons.map(x=>qRow(x,o.c[x.id],'c')).join('')+'</div>';
return h+`<button class="btn" data-a="econ" data-id="">＋ Добавить расходник</button><p class="hint">Список и цены общие для всех объектов, количество у каждого объекта своё. Нажми на цену, чтобы изменить расходник или удалить его.</p>`}

function vSet(){
let h=`<div class="big">Цены на работы</div><p class="hint">Цена за единицу работы. Меняй когда нужно: смета всегда считается по текущим ценам. Нажми на название, чтобы переименовать, сменить раздел или удалить.</p>`;
groups(S.works).forEach(([g,it])=>{h+=`<div class="sub-h">${esc(g)}</div><div class="box">`+it.map(x=>`<div class="row"><button class="rt plain" data-a="ew" data-id="${x.id}"><b>${esc(x.n)} <span class="ed">✎</span></b></button>`+
`<label class="pf"><input class="mono" inputmode="decimal" enterkeyhint="done" data-price="${x.id}" value="${inV(x.p)}" placeholder="0" aria-label="Цена"><span>₽/${esc(x.u)}</span></label></div>`).join('')+'</div>'});
h+=`<button class="btn" data-a="ew" data-id="">＋ Добавить работу</button>`;
h+=`<div class="big">Материалы</div><p class="hint">Список для вкладки «Материалы». Нажми на позицию, чтобы её изменить или удалить.</p>`;
groups(S.mats).forEach(([g,it])=>{h+=`<div class="sub-h">${esc(g)}</div><div class="box">`+it.map(x=>`<button class="row chk" data-a="em" data-id="${x.id}"><span class="rt"><b>${esc(x.n)}</b></span><span class="pr">${esc(x.u)} ✎</span></button>`).join('')+'</div>'});
h+=`<button class="btn" data-a="em" data-id="">＋ Добавить материал</button>`;
h+=`<div class="big">Резервная копия</div><p class="hint">Всё хранится только в этом телефоне. Раз в неделю делай копию и сохраняй её в Заметки.</p>`+
`<div class="two"><button class="btn" data-a="exp">Сделать копию</button><button class="btn" data-a="imp">Загрузить</button></div>`+
`<textarea class="in mono" id="io" rows="4" style="margin-top:10px" placeholder="Здесь появится копия. Чтобы восстановить данные, вставь сюда текст копии и нажми «Загрузить»."></textarea>`;
h+=`<div class="big">Оформление</div><div class="seg">${[['auto','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(t=>`<button class="${S.theme==t[0]?'on':''}" data-a="theme" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
return h}

function bar(){const el=$('bar'),o=cur();
if(tab=='con'&&S.cons.length){const t=conSum(o);
el.innerHTML=`<div class="dock sum"><div class="dk"><small>Расходники на объект</small><b class="mono">${money(t.s)}</b></div><span class="dkc ${o.ci?'on':''}">${o.ci?'в смете':'не в смете'}</span></div>`;return}
if(tab!='est'){el.innerHTML='';return}
const n=calc(o).lines.length;
el.innerHTML=`<div class="dock"><div class="dk"><small>Позиций</small><b class="mono">${n}</b></div><button class="go" data-a="calc" ${n?'':'disabled'}>${BOLT}Рассчитать смету</button></div>`}

// обновляем счётчики без перерисовки, чтобы не сбивать ввод
function counts(){const o=cur();
document.querySelectorAll('[data-cnt]').forEach(el=>{const k=el.dataset.k,n=el.dataset.cnt.split(',').filter(id=>o[k][id]>0).length;el.textContent=n||''});
const nb=$('needc');if(nb){const n=mats(o).filter(x=>o.m[x.id]>0).length;nb.textContent=n?' · '+n:''}}

function render(){$('hd').innerHTML=vHead();$('app').innerHTML={est:vEst,mat:vMat,con:vCon,set:vSet}[tab]();bar()}

// ---------- нижние листы ----------
function openSheet(title,body,opt={}){sheetSave=opt.save||null;sheetDel=opt.del||null;
$('sh').innerHTML=`<div class="ov" data-a="sclose"></div><div class="pn"><div class="grab"></div><div class="sht"><h3>${esc(title)}</h3><button class="x" data-a="sclose" aria-label="Закрыть">✕</button></div>${body}`+
(opt.save?'<button class="btn y" data-a="ssave" style="margin-top:22px">Сохранить</button>':'')+(opt.extra||'')+(opt.del?`<button class="btn r" data-a="sdel">${opt.delT||'Удалить'}</button>`:'')+'</div>';
$('sh').classList.add('open');$('sh').querySelector('.pn').scrollTop=0}
function closeSheet(){$('sh').classList.remove('open');$('sh').innerHTML='';sheetSave=sheetDel=null}
const chips=(tg,arr,v)=>`<div class="chips">${arr.map(s=>`<button type="button" class="${s==v?'on':''}" data-a="chip" data-tg="${tg}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
const unitField=(u,list=UNITS)=>`<label class="lb">Единица</label><input class="in" id="f_u" value="${esc(u)}">${chips('f_u',list,u)}`;

function conSheet(id){const i=S.cons.findIndex(x=>x.id==id),x=i>=0?S.cons[i]:{id:'',n:'',u:'шт',p:0};
openSheet(i>=0?'Расходник':'Новый расходник',`<label class="lb">Название</label><input class="in" id="f_n" value="${esc(x.n)}" placeholder="Например: Хомуты 200 мм">`+unitField(x.u,CUNITS)+
`<label class="lb">Цена за единицу, ₽</label><input class="in mono" id="f_p" inputmode="decimal" value="${inV(x.p)}" placeholder="0"><p class="hint">Цена общая для всех объектов.</p>`,
{save:()=>{const n=$('f_n').value.trim();if(!n){alert('Напиши название');return}const p=num($('f_p').value);
const nx={id:x.id||uid('c'),n,u:$('f_u').value.trim()||'шт',p:p>0?r2(p):0};if(i>=0)S.cons[i]=nx;else S.cons.push(nx);return true},
del:i>=0?()=>{if(!confirm('Удалить «'+x.n+'»? Количество по нему во всех объектах тоже удалится.'))return;
S.cons.splice(i,1);S.objs.forEach(o=>{delete o.c[x.id]});return true}:null})}

function itemSheet(kind,id){
const L=kind=='w'?S.works:S.mats,i=L.findIndex(x=>x.id==id),x=i>=0?L[i]:{id:'',g:(L[L.length-1]||{}).g||'Прочее',n:'',u:'шт',p:0};
const gs=[...new Set(L.map(y=>y.g))];
let b=`<label class="lb">Название</label><input class="in" id="f_n" value="${esc(x.n)}" placeholder="${kind=='w'?'Например: Установка датчика движения':'Например: Кабель ВВГнг-LS 3×4'}">`+unitField(x.u)+
`<label class="lb">Раздел</label><input class="in" id="f_g" value="${esc(x.g)}">${chips('f_g',gs,x.g)}<p class="hint">Выбери раздел или впиши новый.</p>`;
if(kind=='w')b+=`<label class="lb">Цена за единицу, ₽</label><input class="in mono" id="f_p" inputmode="decimal" value="${inV(x.p)}" placeholder="0">`;
openSheet(i>=0?(kind=='w'?'Работа':'Материал'):(kind=='w'?'Новая работа':'Новый материал'),b,{
save:()=>{const n=$('f_n').value.trim(),g=$('f_g').value.trim()||'Прочее',u=$('f_u').value.trim()||'шт';if(!n){alert('Напиши название');return}
const nx={id:x.id||uid(kind),g,n,u};if(kind=='w'){const p=num($('f_p').value);nx.p=p>0?r2(p):0}
if(i>=0&&L[i].g==g)L[i]=nx;else{if(i>=0)L.splice(i,1);insertG(L,nx)}return true},
del:i>=0?()=>{if(!confirm('Удалить «'+x.n+'»? Количество по этой позиции во всех объектах тоже удалится.'))return;
L.splice(i,1);S.objs.forEach(o=>{delete o.q[x.id];delete o.m[x.id];delete o.b[x.id]});return true}:null})}

function priceSheet(id){const x=S.works.find(y=>y.id==id);if(!x)return;
openSheet('Цена',`<div class="pname">${esc(x.n)}</div><label class="lb">Цена за ${esc(x.u)}, ₽</label><input class="in mono" id="f_p" inputmode="decimal" value="${inV(x.p)}" placeholder="0"><p class="hint">Цена сохранится в прайсе и пересчитается во всех объектах.</p>`,
{save:()=>{const p=num($('f_p').value);x.p=p>0?r2(p):0;return true}})}

function xwSheet(id){const o=cur(),i=o.xw.findIndex(x=>x.id==id),x=i>=0?o.xw[i]:{id:'',n:'',u:'шт',p:0};
openSheet(i>=0?'Разовая работа':'Новая разовая работа',`<label class="lb">Название</label><input class="in" id="f_n" value="${esc(x.n)}" placeholder="Например: Перенос щита">`+unitField(x.u)+
`<label class="lb">Цена за единицу, ₽</label><input class="in mono" id="f_p" inputmode="decimal" value="${inV(x.p)}" placeholder="0"><p class="hint">Есть только в объекте «${esc(o.n)}».</p>`,
{save:()=>{const n=$('f_n').value.trim();if(!n){alert('Напиши название');return}const p=num($('f_p').value);
const nx={id:x.id||uid('x'),n,u:$('f_u').value.trim()||'шт',p:p>0?r2(p):0};if(i>=0)o.xw[i]=nx;else{o.xw.push(nx);o.q[nx.id]=1}return true},
del:i>=0?()=>{if(!confirm('Удалить «'+x.n+'»?'))return;o.xw.splice(i,1);delete o.q[x.id];return true}:null})}

function xmSheet(id,g){const o=cur(),i=o.xm.findIndex(x=>x.id==id),x=i>=0?o.xm[i]:{id:'',g,n:'',u:'шт'};
openSheet('Свой вариант',`<div class="pname">Раздел «${esc(x.g)}»</div><label class="lb">Название</label><input class="in" id="f_n" value="${esc(x.n)}" placeholder="${x.g=='Рамки'?'Например: Рамка на 4 поста':'Название материала'}">`+unitField(x.u)+
`<label class="lb">Количество</label><input class="in mono" id="f_q" inputmode="decimal" value="${inV(o.m[x.id])}" placeholder="0"><p class="hint">Есть только в объекте «${esc(o.n)}».</p>`,
{save:()=>{const n=$('f_n').value.trim();if(!n){alert('Напиши название');return}
const nx={id:x.id||uid('y'),g:x.g,n,u:$('f_u').value.trim()||'шт'};if(i>=0)o.xm[i]=nx;else o.xm.push(nx);setQ(o,'m',nx.id,num($('f_q').value));return true},
del:i>=0?()=>{if(!confirm('Удалить «'+x.n+'»?'))return;o.xm.splice(i,1);delete o.m[x.id];delete o.b[x.id];return true}:null})}

function objsSheet(){
const b='<div class="box">'+S.objs.map(o=>{const c=calc(o);
return `<div class="row ${o.id==S.cur?'sel':''}"><button class="rt plain" data-a="pick" data-id="${o.id}"><b>${esc(o.n)}</b><span class="pr">${esc([o.cl,fmtD(o.d)].filter(Boolean).join(' · '))}</span></button>`+
(c.lines.length?`<span class="amt mono">${money(c.tot)}</span>`:'')+`<button class="ib" data-a="eobj" data-id="${o.id}" aria-label="Изменить">✎</button></div>`}).join('')+'</div>';
openSheet('Объекты',b+'<button class="btn y" data-a="eobj" data-id="">＋ Новый объект</button>')}

function objSheet(id){const i=S.objs.findIndex(o=>o.id==id),o=i>=0?S.objs[i]:newObj('');
openSheet(i>=0?'Объект':'Новый объект',`<label class="lb">Название</label><input class="in" id="f_n" value="${esc(o.n)}" placeholder="Например: Дом, ул. Лесная, 12">`+
`<label class="lb">Заказчик</label><input class="in" id="f_c" value="${esc(o.cl)}" placeholder="Имя и телефон">`+
`<label class="lb">Заметка</label><textarea class="in" id="f_t" rows="3" placeholder="Что важно помнить по объекту">${esc(o.nt)}</textarea>`,
{save:()=>{const n=$('f_n').value.trim();if(!n){alert('Напиши название');return}o.n=n;o.cl=$('f_c').value.trim();o.nt=$('f_t').value.trim();
if(i<0){S.objs.unshift(o);S.cur=o.id}return true},
extra:i>=0?`<button class="btn" data-a="dupobj" data-id="${o.id}">Сделать копию объекта</button>`:'',
del:i>=0?()=>{if(!confirm('Удалить объект «'+o.n+'» вместе со сметой и материалами?'))return;S.objs.splice(i,1);
if(!S.objs.length)S.objs.push(newObj());if(!S.objs.some(x=>x.id==S.cur))S.cur=S.objs[0].id;return true}:null,delT:'Удалить объект'})}

function estSheet(){const o=cur(),c=calc(o);if(!c.lines.length)return;
let h=`<div class="rc"><div class="rch"><div><small>Смета · электромонтаж</small><b>${esc(o.n)}</b>${o.cl?`<span>${esc(o.cl)}</span>`:''}</div><span class="mono">${fmtD(today())}</span></div>`;
groups(c.lines).forEach(([g,ls])=>{h+=`<h4>${esc(g)}</h4>`+ls.map(l=>`<div class="ln"><div class="t">${esc(l.n)}<small class="mono">${fN(l.q)} ${esc(l.u)} × ${l.p?money(l.p):'нет цены'}</small></div><div class="s mono">${money(l.s)}</div></div>`).join('')});
h+=`<div class="tl"><div class="sm"><span>Сумма</span><b class="mono">${money(c.sum)}</b></div>`+
`<div class="sm"><span>Скидка</span><span class="dv"><span class="mono" id="e_dv">${c.dv?'−'+money(c.dv):''}</span><label class="pf"><input class="mono" id="f_disc" inputmode="decimal" enterkeyhint="done" value="${inV(c.disc)}" placeholder="0" aria-label="Скидка в процентах"><span>%</span></label></span></div></div>`;
h+=`<div class="grand"><span>Итого</span><b class="mono" id="e_tot">${money(c.tot)}</b></div><p class="hint" style="margin-top:12px">${footNote(c)}</p></div>`;
if(c.miss)h+=`<div class="note bad">Позиций без цены: ${c.miss}. Они посчитаны как 0 ₽. Цены ставятся в «Настройках».</div>`;
h+=`<div class="two"><button class="btn y" data-a="eshare">Отправить</button><button class="btn" data-a="ecopy">Скопировать</button></div>`;
openSheet('Смета',h)}

// ---------- текст для заказчика и магазина ----------
function estText(o){const c=calc(o);
let t=`Смета на электромонтажные работы\nОбъект: ${o.n}\n`+(o.cl?`Заказчик: ${o.cl}\n`:'')+`Дата: ${fmtD(today())}\n`,i=0;
groups(c.lines).forEach(([g,ls])=>{t+=`\n${g}\n`;ls.forEach(l=>{t+=`${++i}. ${l.n}: ${fN(l.q)} ${l.u} × ${money(l.p)} = ${money(l.s)}\n`})});
t+='\n';if(c.disc)t+=`Сумма: ${money(c.sum)}\nСкидка ${fN(c.disc)}%: −${money(c.dv)}\n`;
return t+`Итого: ${money(c.tot)}\n\n${footNote(c)}`}
function matText(o){const need=mats(o).filter(x=>o.m[x.id]>0&&!o.b[x.id]);if(!need.length)return'';
let t=`Купить для объекта «${o.n}»\n`;groups(need).forEach(([g,it])=>{t+=`\n${g}\n`;it.forEach(x=>{t+=`— ${x.n}: ${fN(o.m[x.id])} ${x.u}\n`})});return t.trim()}

let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}
function share(t){if(navigator.share){navigator.share({text:t}).catch(err=>{if(!err||err.name!='AbortError')copy(t)});return}copy(t)}
function copy(t,msg){const ok=()=>toast(msg||'Скопировано');
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>legacy(t,ok));else legacy(t,ok)}
function legacy(t,ok){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();r?ok():toast('Не получилось скопировать')}
function applyTheme(){const r=document.documentElement;if(S.theme=='auto')r.removeAttribute('data-theme');else r.dataset.theme=S.theme;
document.querySelector('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--bg').trim()}

// ---------- события ----------
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.k){const o=cur(),v=num(t.value);setQ(o,d.k,d.id,v);save();t.closest('.row').classList.toggle('sel',v>0);counts();bar();return}
if(d.price){const x=S.works.find(y=>y.id==d.price),v=num(t.value);if(x){x.p=v>0?r2(v):0;save()}return}
if(t.id=='f_disc'){const o=cur(),v=num(t.value);o.disc=v>0?Math.min(100,v):0;save();const c=calc(o);
$('e_dv').textContent=c.dv?'−'+money(c.dv):'';$('e_tot').textContent=money(c.tot)}});

document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,D=b.dataset;
switch(a){
case 'tab':tab=D.t;closeSheet();render();window.scrollTo(0,0);return;
case 'mmode':mmode=D.v;render();return;
case 'objs':objsSheet();return;
case 'pick':S.cur=D.id;closeSheet();save();render();window.scrollTo(0,0);return;
case 'eobj':objSheet(D.id);return;
case 'dupobj':{const o=S.objs.find(x=>x.id==D.id),c=JSON.parse(JSON.stringify(o));c.id=uid('o');c.n=o.n+' (копия)';c.d=today();c.b={};
S.objs.unshift(c);S.cur=c.id;closeSheet();toast('Копия объекта создана');break}
case 'inc':case 'dec':{const o=cur(),c=o[D.k][D.id]||0,v=Math.max(0,a=='inc'?Math.floor(c)+1:Math.ceil(c)-1);setQ(o,D.k,D.id,v);save();
const r=b.closest('.row');r.querySelector('input').value=inV(v);r.classList.toggle('sel',v>0);counts();bar();return}
case 'price':priceSheet(D.id);return;
case 'exw':xwSheet(D.id);return;
case 'exm':xmSheet(D.id);return;
case 'xm':xmSheet('',D.g);return;
case 'ew':itemSheet('w',D.id);return;
case 'em':itemSheet('m',D.id);return;
case 'econ':conSheet(D.id);return;
case 'ci':{const o=cur();o.ci=!o.ci;break}
case 'chip':{const f=$(D.tg);if(f)f.value=D.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));return}
case 'calc':estSheet();return;
case 'eshare':share(estText(cur()));return;
case 'ecopy':copy(estText(cur()));return;
case 'buy':{const o=cur();if(o.b[D.id])delete o.b[D.id];else o.b[D.id]=1;break}
case 'mshare':case 'mcopy':{const t=matText(cur());if(!t){toast('Всё уже куплено');return}if(a=='mshare')share(t);else copy(t);return}
case 'mreset':if(!confirm('Снять все отметки «куплено»?'))return;cur().b={};break;
case 'theme':S.theme=D.v;applyTheme();break;
case 'exp':{const t=JSON.stringify(S);$('io').value=t;copy(t,'Копия скопирована. Сохрани её в Заметки');return}
case 'imp':{let o;try{o=JSON.parse($('io').value)}catch(x){alert('Не удалось прочитать текст');return}
if(!o||!o.v||!Array.isArray(o.works)){alert('Это не копия Электросметы');return}
if(!confirm('Заменить все текущие данные этой копией?'))return;S=migrate(o);applyTheme();toast('Копия загружена');break}
case 'sclose':closeSheet();return;
case 'ssave':if(!(sheetSave&&sheetSave()))return;closeSheet();break;
case 'sdel':if(!(sheetDel&&sheetDel()))return;closeSheet();break;
default:return}
save();render()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});

load();applyTheme();render();
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
